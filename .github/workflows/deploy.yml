name: Verify and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://example.com' }}
  LEGAL_NAME: ${{ github.event_name == 'pull_request' && 'Test Name' || secrets.LEGAL_NAME }}
  LEGAL_STREET: ${{ github.event_name == 'pull_request' && 'Teststraße 1' || secrets.LEGAL_STREET }}
  LEGAL_POSTAL_CODE: ${{ github.event_name == 'pull_request' && '12345' || secrets.LEGAL_POSTAL_CODE }}
  LEGAL_CITY: ${{ github.event_name == 'pull_request' && 'Teststadt' || secrets.LEGAL_CITY }}
  LEGAL_COUNTRY: ${{ github.event_name == 'pull_request' && 'Deutschland' || secrets.LEGAL_COUNTRY }}
  LEGAL_EMAIL: ${{ github.event_name == 'pull_request' && 'test@example.test' || secrets.LEGAL_EMAIL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install, verify, build, and upload
        uses: withastro/action@v6
        with:
          node-version: 24.20.0
          package-manager: pnpm@11.24.0
          build-cmd: pnpm verify

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SITE_URL != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
